<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTN Agent Database</title>
<meta name="theme-color" content="#FFCC00">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f4f4}
.header{background:#FFCC00;padding:15px;text-align:center;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.header h1{font-weight:900;font-size:20px}
.container{max-width:480px;margin:0 auto;padding:15px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:14px}
input,textarea{width:100%;padding:12px;border:2px solid #eee;border-radius:10px;margin:6px 0;font-size:15px}
input:focus{border-color:#FFCC00;outline:none}
.btn{width:100%;padding:13px;background:#000;color:#FFCC00;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:8px}
.btn-yellow{background:#FFCC00;color:#000}
.btn-grey{background:#eee;color:#000}
.hidden{display:none}
.badge{background:#000;color:#FFCC00;padding:5px 12px;border-radius:20px;font-size:12px}
.success{background:#d4edda;color:#155724;padding:12px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:10px}
.agent{display:flex;gap:12px;background:#fff;border-radius:12px;padding:12px;margin:10px 0;align-items:center}
.agent img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #FFCC00}
.actions{display:flex;gap:6px;margin-top:6px}
.actions button{padding:6px 12px;border-radius:6px;border:none;font-size:12px;font-weight:bold;cursor:pointer}
.view{background:#FFCC00}.del{background:#ff3b30;color:#fff}
.detail{background:#fffbe6;border:2px dashed #FFCC00;border-radius:10px;padding:10px;margin-top:8px}
.total-bar{display:flex;justify-content:space-between;background:#000;color:#FFCC00;padding:10px 15px;border-radius:10px;margin-bottom:10px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h1>MTN Agent Database</h1>
<span id="countBadge" class="badge" style="background:#000;color:#FFCC00">0 Agents</span>
</div>

<div class="container">
<div id="welcomeMsg" class="success">✅ Offline Ready - Works without Internet</div>

<div class="card">
<h3>Add New Agent</h3>
<input id="name" placeholder="Agent Name *">
<input id="phone" placeholder="Phone Number *">
<input id="nin" placeholder="NIN (optional)">
<input id="bvn" placeholder="BVN (optional)">
<textarea id="addr" rows="2" placeholder="Address (optional)"></textarea>
<input id="photo" type="file" accept="image/*">
<img id="preview" style="width:70px;height:70px;border-radius:50%;display:none;margin-top:8px;object-fit:cover;border:2px solid #FFCC00">
<button class="btn btn-yellow" onclick="saveAgent()">💾 SAVE AGENT</button>
</div>

<div class="total-bar"><span>Total Agents</span><span id="totalCount">0</span></div>

<div class="card" style="padding:10px">
<input id="search" placeholder="🔍 Search by Name or Phone..." oninput="showAgents()">
</div>

<div id="list"></div>
<div id="empty" style="text-align:center;color:#999;padding:40px 20px">
<p style="font-size:40px">📂</p>
<p>No agents yet</p>
<p style="font-size:12px">Add your first agent above</p>
</div>
</div>

<script>
let agents = JSON.parse(localStorage.getItem('mtn_agents_direct')||'[]');
let photoData='';
let openId=-1;

document.getElementById('photo').addEventListener('change',e=>{
 let f=e.target.files[0];if(!f)return;
 let r=new FileReader();
 r.onload=ev=>{
  photoData=ev.target.result;
  let pr=document.getElementById('preview');
  pr.src=photoData;pr.style.display='block';
 };
 r.readAsDataURL(f);
});

function saveAgent(){
 let n=document.getElementById('name').value.trim();
 let ph=document.getElementById('phone').value.trim();
 let nin=document.getElementById('nin').value.trim();
 let bvn=document.getElementById('bvn').value.trim();
 let addr=document.getElementById('addr').value.trim();
 if(!n||!ph){alert('⚠️ Please enter Name & Phone!');return;}
 let obj={id:Date.now(),name:n,phone:ph,nin,bvn,addr,photo:photoData||'https://cdn-icons-png.flaticon.com/512/149/149071.png'};
 agents.unshift(obj);
 localStorage.setItem('mtn_agents_direct',JSON.stringify(agents));
 ['name','phone','nin','bvn','addr'].forEach(id=>document.getElementById(id).value='');
 document.getElementById('photo').value='';
 document.getElementById('preview').style.display='none';
 photoData='';
 showAgents();
 // success feedback
 let w=document.getElementById('welcomeMsg');
 w.innerText='✅ Agent Saved: '+n;
 w.style.display='block';
 setTimeout(()=>{w.innerText='✅ Offline Ready - Works without Internet';},2000);
}

function showAgents(){
 let q=document.getElementById('search').value.toLowerCase();
 let list=document.getElementById('list');
 list.innerHTML='';
 let f=agents.filter(a=>a.name.toLowerCase().includes(q)||a.phone.includes(q));
 document.getElementById('empty').style.display = agents.length==0? 'block' : 'none';
 document.getElementById('totalCount').innerText = agents.length;
 document.getElementById('countBadge').innerText = agents.length + ' Agents';
 f.forEach(a=>{
  let idx=agents.findIndex(x=>x.id==a.id);
  let d=document.createElement('div');
  d.className='agent';
  d.innerHTML=`<img src="${a.photo}"><div style="flex:1"><b>${a.name}</b><br><small>📞 ${a.phone}</small><div class="actions"><button class="view" onclick="toggle(${idx})">${openId==idx?'CLOSE':'VIEW'}</button><button class="del" onclick="delAg(${idx})">DELETE</button></div><div class="${openId==idx?'detail':'hidden'}"><p><b>Phone:</b> ${a.phone}</p><p><b>NIN:</b> ${a.nin||'-'}</p><p><b>BVN:</b> ${a.bvn||'-'}</p><p><b>Address:</b> ${a.addr||'-'}</p><button class="btn btn-grey" style="padding:8px;margin-top:6px" onclick="toggle(${idx})">CLOSE</button></div></div>`;
  list.appendChild(d);
 });
}

function toggle(i){openId=openId==i?-1:i;showAgents();}
function delAg(i){if(confirm('Delete '+agents[i].name+'?')){agents.splice(i,1);localStorage.setItem('mtn_agents_direct',JSON.stringify(agents));if(openId==i)openId=-1;showAgents();}}

showAgents();

// Offline App Service Worker
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js').then(()=>console.log('Offline Ready!'));
}
</script>
</body>
</html>
